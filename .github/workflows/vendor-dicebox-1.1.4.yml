name: Vendor DiceBox 1.1.4

on:
  push:
    branches:
      - hardening/production-10-of-10
    paths:
      - .github/workflows/vendor-dicebox-1.1.4.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/production-10-of-10
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Fetch exact DiceBox npm package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dicebox-vendor
          mkdir -p /tmp/dicebox-vendor
          cd /tmp/dicebox-vendor
          TARBALL="$(npm pack @3d-dice/dice-box@1.1.4 --ignore-scripts --silent)"
          tar -xzf "$TARBALL"
          test "$(node -p "require('./package/package.json').version")" = "1.1.4"
          test -f package/dist/dice-box.es.min.js
          test -f package/dist/assets/themes/default/default.json
          test -f package/dist/assets/themes/default/theme.config.json
      - name: Stage minimal self-hosted runtime
        shell: bash
        run: |
          set -euo pipefail
          TARGET="vendor/dice-box-1.1.4"
          rm -rf "$TARGET"
          mkdir -p "$TARGET/assets/themes"
          cp /tmp/dicebox-vendor/package/dist/dice-box.es.min.js "$TARGET/"
          cp -R /tmp/dicebox-vendor/package/dist/assets/themes/default "$TARGET/assets/themes/"
          cp /tmp/dicebox-vendor/package/package.json "$TARGET/upstream-package.json"
          if compgen -G "/tmp/dicebox-vendor/package/LICENSE*" > /dev/null; then
            cp /tmp/dicebox-vendor/package/LICENSE* "$TARGET/"
          fi
          (
            cd "$TARGET"
            find . -type f ! -name VENDOR_MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > VENDOR_MANIFEST.sha256
          )
      - name: Commit vendored files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- vendor/dice-box-1.1.4 && git ls-files --error-unmatch vendor/dice-box-1.1.4/VENDOR_MANIFEST.sha256 >/dev/null 2>&1; then
            echo "DiceBox vendor tree already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/dice-box-1.1.4
          git commit -m "Vendor pinned DiceBox 1.1.4 runtime assets"
          git push origin HEAD:hardening/production-10-of-10
