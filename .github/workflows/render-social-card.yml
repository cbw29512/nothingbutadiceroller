name: Render Social Card PNG

on:
  push:
    branches:
      - hardening/production-10-of-10
    paths:
      - .github/workflows/render-social-card.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/production-10-of-10
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Render 1200x630 social card PNG
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('social-card.svg', { density: 144 })
            .resize(1200, 630, { fit: 'fill' })
            .png({ compressionLevel: 9, adaptiveFiltering: true })
            .toFile('social-card.png');
          const metadata = await sharp('social-card.png').metadata();
          if (metadata.width !== 1200 || metadata.height !== 630 || metadata.format !== 'png') {
            throw new Error(`Unexpected social card output: ${JSON.stringify(metadata)}`);
          }
          NODE
      - name: Commit rendered image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-card.png
          if git diff --cached --quiet; then
            echo "Social card PNG already current"
            exit 0
          fi
          git commit -m "Render crawler-compatible social card PNG"
          git push origin HEAD:hardening/production-10-of-10
