name: Phase 0 Lock Refresh

on:
  push:
    branches:
      - feature/custom-roll-shortcuts
    paths:
      - package.json
      - .github/workflows/phase0-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/custom-roll-shortcuts

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "[skip netlify] Phase 0: synchronize package lock"
          git push origin HEAD:feature/custom-roll-shortcuts
