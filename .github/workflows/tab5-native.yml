name: Tab5 Native Firmware
on:
  pull_request:
    paths:
      - 'tab5/**'
      - '.github/workflows/tab5-native.yml'
  push:
    branches: [feat/tab5-universal-dice-foundation-20261115]
    paths:
      - 'tab5/**'
      - '.github/workflows/tab5-native.yml'
  workflow_dispatch:

jobs:
  host-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native host tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            tab5/native/main/dice_engine.c tab5/native/tests/test_dice_engine.c \
            -o /tmp/tab5_dice_engine_test
          /tmp/tab5_dice_engine_test
      - name: Portable JS tests
        run: node --test tab5/*.test.mjs
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-P4 firmware with IDF 6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.1
          target: esp32p4
          path: tab5/native
      - name: Verify and package flash images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tab5/flash-package
          cp tab5/native/build/bootloader/bootloader.bin tab5/flash-package/
          cp tab5/native/build/partition_table/partition-table.bin tab5/flash-package/
          cp tab5/native/build/tab5_dice.bin tab5/flash-package/
          cd tab5/flash-package
          sha256sum bootloader.bin partition-table.bin tab5_dice.bin > SHA256SUMS.txt
          printf 'BOOTLOADER=0x2000\nPARTITION_TABLE=0x8000\nAPP=0x10000\n' > flash-offsets.txt
          cat SHA256SUMS.txt
      - name: Upload Tab5 firmware for review
        uses: actions/upload-artifact@v4
        with:
          name: tab5-dice-esp32p4-${{ github.sha }}
          path: tab5/flash-package/
          if-no-files-found: error
          retention-days: 14
