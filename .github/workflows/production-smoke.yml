name: Production Synthetic Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-synthetic-monitor
  cancel-in-progress: false

jobs:
  production-health:
    name: Production roller health
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Check live roller, runtime, Blob API, and auth boundary
        run: node scripts/production-smoke.mjs
