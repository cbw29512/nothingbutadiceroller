name: Refresh Sharp lockfile

on:
  push:
    branches:
      - hardening/production-10-of-10
    paths:
      - package.json
      - .github/workflows/refresh-sharp-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/production-10-of-10
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Sharp image decoder"
          git push origin HEAD:hardening/production-10-of-10
