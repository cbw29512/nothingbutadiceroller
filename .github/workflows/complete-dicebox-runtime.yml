name: Complete DiceBox Runtime Vendor

on:
  push:
    branches:
      - hardening/production-10-of-10
    paths:
      - .github/workflows/complete-dicebox-runtime.yml

permissions:
  contents: write

jobs:
  vendor-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/production-10-of-10
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Fetch exact DiceBox npm package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dicebox-runtime
          mkdir -p /tmp/dicebox-runtime
          cd /tmp/dicebox-runtime
          TARBALL="$(npm pack @3d-dice/dice-box@1.1.4 --ignore-scripts --silent)"
          tar -xzf "$TARBALL"
          test "$(node -p "require('./package/package.json').version")" = "1.1.4"
          for FILE in \
            package/dist/world.offscreen.min.js \
            package/dist/world.onscreen.min.js \
            package/dist/world.none.min.js \
            package/dist/assets/ammo/ammo.wasm.wasm; do
            test -f "$FILE"
          done
      - name: Add required runtime files and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          TARGET="vendor/dice-box-1.1.4"
          mkdir -p "$TARGET/assets/ammo"
          cp /tmp/dicebox-runtime/package/dist/world.offscreen.min.js "$TARGET/"
          cp /tmp/dicebox-runtime/package/dist/world.onscreen.min.js "$TARGET/"
          cp /tmp/dicebox-runtime/package/dist/world.none.min.js "$TARGET/"
          cp /tmp/dicebox-runtime/package/dist/assets/ammo/ammo.wasm.wasm "$TARGET/assets/ammo/"
          (
            cd "$TARGET"
            find . -type f ! -name VENDOR_MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > VENDOR_MANIFEST.sha256
          )
      - name: Commit completed runtime vendor
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- vendor/dice-box-1.1.4; then
            echo "DiceBox runtime vendor already complete"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/dice-box-1.1.4
          git commit -m "Complete pinned DiceBox runtime vendor"
          git push origin HEAD:hardening/production-10-of-10
