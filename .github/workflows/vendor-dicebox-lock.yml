name: Vendor DiceBox Lockfile

on:
  push:
    branches:
      - hardening/production-10-of-10
    paths:
      - .github/workflows/vendor-dicebox-lock.yml

permissions:
  contents: write

jobs:
  vendor-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/production-10-of-10
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Pin DiceBox package without install scripts
        run: npm install --save-exact --ignore-scripts @3d-dice/dice-box@1.1.4
      - name: Commit deterministic package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Pin DiceBox 1.1.4 for self-hosted runtime"
          git push origin HEAD:hardening/production-10-of-10
