<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Physics Dice Roller & Tabletop Companion</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 3D Dice Physics Engine -->
    <script src="https://unpkg.com/@3d-dice/dice-box@1.1.5/dist/dice-box.min.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="logo">
            <h1>🎲 3D Physics Dice Roller</h1>
        </div>
        <div class="header-controls">
            <button class="btn secondary" onclick="openHistory()">📜 History</button>
            <button class="btn secondary" onclick="openThemes()">🎨 Themes</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="app-container">

        <!-- Controls Panel -->
        <section class="controls-panel">
            <div class="section-label">Select Dice</div>
            <div class="dice-selector" id="diceSelectorGrid">
                <button class="die-btn" data-die="d4">d4</button>
                <button class="die-btn" data-die="d6">d6</button>
                <button class="die-btn" data-die="d8">d8</button>
                <button class="die-btn" data-die="d10">d10</button>
                <button class="die-btn" data-die="d12">d12</button>
                <button class="die-btn" data-die="d20">d20</button>
                <button class="die-btn" data-die="d100">d100</button>
                <button class="die-btn" data-die="custom" id="customDieBtn">Custom</button>
            </div>

            <div class="advantage-toggle">
                <div class="section-label">Advantage / Disadvantage (d20)</div>
                <div class="adv-btn-group">
                    <button class="adv-btn active" data-adv="normal">Normal</button>
                    <button class="adv-btn" data-adv="advantage">Advantage</button>
                    <button class="adv-btn" data-adv="disadvantage">Disadvantage</button>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn danger" id="clearBtn">Clear</button>
                <button class="btn primary" id="rollBtn">Roll Dice!</button>
            </div>
        </section>

        <!-- Tray Container -->
        <section class="tray-container">
            <!-- 3D Dice Canvas Target -->
            <div class="dice-tray" id="diceTray"></div>

            <!-- Results Bar -->
            <div class="results-bar">
                <div class="results-label">
                    <span>Total Result</span>
                    <span class="breakdown-text" id="breakdownText">No active roll</span>
                </div>
                <div class="total-number" id="totalNumber">0</div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="support-section">
            <p>Powered by 3D Physics &bull; Built for immersive tabletop adventures.</p>
        </div>
    </footer>

    <!-- History Drawer -->
    <div class="drawer hidden" id="historyDrawer">
        <div class="drawer-backdrop" onclick="closeHistory()"></div>
        <div class="drawer-content">
            <div class="drawer-header">
                <h3>Roll History</h3>
                <button class="close-btn" onclick="closeHistory()">&times;</button>
            </div>
            <div class="history-list" id="historyList">
                <div style="color: #71717a; text-align: center; margin-top: 2rem;">No roll history yet.</div>
            </div>
        </div>
    </div>

    <!-- Theme & Skin Drawer -->
    <div class="drawer hidden" id="themeDrawer">
        <div class="drawer-backdrop" onclick="closeThemes()"></div>
        <div class="drawer-content">
            <div class="drawer-header">
                <h3>Customization</h3>
                <button class="close-btn" onclick="closeThemes()">&times;</button>
            </div>
            
            <div class="section-label">Dice Theme / Color</div>
            <div class="picker-grid">
                <button class="swatch-btn" onclick="setTheme('default')">Default</button>
                <button class="swatch-btn" onclick="setTheme('purple')">Purple</button>
                <button class="swatch-btn" onclick="setTheme('green')">Green</button>
                <button class="swatch-btn" onclick="setTheme('red')">Red</button>
                <button class="swatch-btn" onclick="setTheme('blue')">Blue</button>
                <button class="swatch-btn" onclick="setTheme('black')">Black</button>
            </div>

            <div class="section-label" style="margin-top: 1rem;">Tray Backgrounds</div>
            <div class="picker-grid">
                <button class="swatch-btn" onclick="setTray('#0d2818')">Green Felt</button>
                <button class="swatch-btn" onclick="setTray('#3b0a0a')">Red Velvet</button>
                <button class="swatch-btn" onclick="setTray('#111318')">Midnight</button>
                <button class="swatch-btn" onclick="setTray('#21262d')">Dungeon Stone</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
