<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Physics Dice Roller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Main Controls Sidebar -->
        <div class="sidebar">
            <h2>Dice Roller</h2>
            
            <div class="section-title">SELECT DICE</div>
            <div id="diceSelectorGrid" class="dice-grid">
                <button class="die-btn" data-die="d4">d4</button>
                <button class="die-btn" data-die="d6">d6</button>
                <button class="die-btn" data-die="d8">d8</button>
                <button class="die-btn" data-die="d10">d10</button>
                <button class="die-btn" data-die="d12">d12</button>
                <button class="die-btn" data-die="d20">d20</button>
                <button class="die-btn" data-die="d100">d100</button>
                <button class="die-btn" id="customDieBtn" data-die="custom">Custom</button>
            </div>

            <div class="section-title">ADVANTAGE / DISADVANTAGE (D20)</div>
            <div class="adv-grid">
                <button class="adv-btn active" data-adv="normal">Normal</button>
                <button class="adv-btn" data-adv="advantage">Advantage</button>
                <button class="adv-btn" data-adv="disadvantage">Disadvantage</button>
            </div>

            <div class="action-buttons">
                <button id="clearBtn" class="action-btn clear-btn">Clear</button>
                <button id="rollBtn" class="action-btn roll-btn">Roll Dice!</button>
            </div>
        </div>

        <!-- 3D Dice Tray Container -->
        <div id="diceTray" class="dice-tray"></div>

        <!-- Results Footer Bar -->
        <div class="results-bar">
            <div class="total-section">
                <span class="label">TOTAL RESULT</span>
                <span id="totalNumber" class="value">0</span>
            </div>
            <div class="breakdown-section">
                <span id="breakdownText" class="breakdown">No active roll</span>
            </div>
        </div>
    </div>

    <!-- Load DiceBox Library Globally via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@3d-dice/dice-box@1.1.5/dist/dice-box.min.js"></script>
    <!-- Load App Logic -->
    <script src="script.js"></script>
</body>
</html>
