<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nothing But A TTRPG Dice Roller</title>
  <meta name="description" content="A clean, fast, and bloat-free tabletop RPG dice roller for D&D, Pathfinder, and TTRPG sessions.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Nothing But A TTRPG Dice Roller</h1>
      <p class="subtitle">Fast, clean dice rolls for your tabletop sessions.</p>
    </header>

    <main>
      <section class="dice-grid" aria-label="Dice Selection">
        <button class="dice-btn" data-dice="4">d4</button>
        <button class="dice-btn" data-dice="6">d6</button>
        <button class="dice-btn" data-dice="8">d8</button>
        <button class="dice-btn" data-dice="10">d10</button>
        <button class="dice-btn" data-dice="12">d12</button>
        <button class="dice-btn" data-dice="20">d20</button>
        <button class="dice-btn" data-dice="100">d100</button>
      </section>

      <section class="modifier-section">
        <label for="modifier">Modifier:</label>
        <input type="number" id="modifier" value="0" step="1">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" value="1" min="1" max="100" step="1">
      </section>

      <section class="display-section" aria-live="polite">
        <div id="roll-result" class="result-display">Ready to roll</div>
        <div id="roll-breakdown" class="breakdown-display"></div>
      </section>

      <section class="controls">
        <button id="clear-btn" class="secondary-btn">Clear History</button>
      </section>

      <section class="history-section">
        <h2>Roll History</h2>
        <ul id="history-list" class="history-list"></ul>
      </section>
    </main>

    <footer>
      <div class="support-section">
        <p>No ads, no bloat—just a clean dice roller for your tabletop games.</p>
        <a href="https://ko-fi.com/divclass01" target="_blank" rel="noopener noreferrer" class="coffee-btn">
          ☕ Support My Apps on Ko-fi
        </a>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
