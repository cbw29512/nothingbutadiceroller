<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dice Roller & Tabletop Companion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="logo">
            <h1>🎲 3D Dice Roller</h1>
        </div>
        <div class="header-controls">
            <button class="btn secondary" onclick="openHistory()">📜 History</button>
            <button class="btn secondary" onclick="openThemes()">🎨 Themes</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="app-container">

        <!-- Controls Panel -->
        <section class="controls-panel">
            <div class="section-label">Select Dice</div>
            <div class="dice-selector">
                <button class="die-btn" data-die="d4">d4</button>
                <button class="die-btn" data-die="d6">d6</button>
                <button class="die-btn" data-die="d8">d8</button>
                <button class="die-btn" data-die="d10">d10</button>
                <button class="die-btn" data-die="d12">d12</button>
                <button class="die-btn" data-die="d20">d20</button>
                <button class="die-btn" data-die="d100">d100</button>
            </div>

            <div class="advantage-toggle">
                <div class="section-label">Advantage / Disadvantage (d20)</div>
                <div class="adv-btn-group">
                    <button class="adv-btn active" data-adv="normal">Normal</button>
                    <button class="adv-btn" data-adv="advantage">Advantage</button>
                    <button class="adv-btn" data-adv="disadvantage">Disadvantage</button>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn danger" id="clearBtn">Clear</button>
                <button class="btn primary" id="rollBtn">Roll Dice!</button>
            </div>
        </section>

        <!-- Tray Container -->
        <section class="tray-container">
            <div class="dice-tray" id="diceTray">
                <div class="tray-placeholder">Select your dice above and hit Roll!</div>
            </div>

            <!-- Results Bar -->
            <div class="results-bar">
                <div class="results-label">
                    <span>Total Result</span>
                    <span class="breakdown-text" id="breakdownText">No active roll</span>
                </div>
                <div class="total-number" id="totalNumber">0</div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="footer-content">
            <div class="support-section">
                <p>Built for immersive tabletop adventures.</p>
            </div>
        </div>
    </footer>

    <!-- History Drawer -->
    <div class="drawer hidden" id="historyDrawer">
        <div class="drawer-backdrop" onclick="closeHistory()"></div>
        <div class="drawer-content">
            <div class="drawer-header">
                <h3>Roll History</h3>
                <button class="close-btn" onclick="closeHistory()">&times;</button>
            </div>
            <div class="history-list" id="historyList">
                <div style="color: #71717a; text-align: center; margin-top: 2rem;">No roll history yet.</div>
            </div>
        </div>
    </div>

    <!-- Theme & Skin Drawer -->
    <div class="drawer hidden" id="themeDrawer">
        <div class="drawer-backdrop" onclick="closeThemes()"></div>
        <div class="drawer-content">
            <div class="drawer-header">
                <h3>Customization</h3>
                <button class="close-btn" onclick="closeThemes()">&times;</button>
            </div>
            
            <div class="section-label">Dice Skins</div>
            <div class="picker-grid">
                <button class="swatch-btn" onclick="setSkin('ruby_red')">Ruby Red</button>
                <button class="swatch-btn" onclick="setSkin('sapphire_blue')">Sapphire Blue</button>
                <button class="swatch-btn" onclick="setSkin('emerald_green')">Emerald Green</button>
                <button class="swatch-btn" onclick="setSkin('amethyst_purple')">Amethyst</button>
                <button class="swatch-btn" onclick="setSkin('marble_white')">Marble White</button>
                <button class="swatch-btn" onclick="setSkin('gold_leaf')">Gold Leaf</button>
                <button class="swatch-btn" onclick="setSkin('neon_cyan')">Neon Cyan</button>
                <button class="swatch-btn" onclick="setSkin('blood_moon')">Blood Moon</button>
            </div>

            <div class="section-label" style="margin-top: 1rem;">Tray Themes</div>
            <div class="picker-grid">
                <button class="swatch-btn" onclick="setTray('green_felt')">Green Felt</button>
                <button class="swatch-btn" onclick="setTray('red_velvet')">Red Velvet</button>
                <button class="swatch-btn" onclick="setTray('midnight_leather')">Midnight</button>
                <button class="swatch-btn" onclick="setTray('dungeon_stone')">Dungeon Stone</button>
                <button class="swatch-btn" onclick="setTray('neon_cyberpunk')">Cyberpunk</button>
                <button class="swatch-btn" onclick="setTray('lava_pit')">Lava Pit</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
